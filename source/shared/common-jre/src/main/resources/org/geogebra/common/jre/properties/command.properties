# <Name>=<English command name>. Usually the internal name; where
# Commands.englishToInternal maps an English alias to an internal command,
# the alias is the English name (for example Mirror=Reflect).
# <Name>.Syntax, .Syntax3D, .SyntaxCAS: one signature per line, separated by
# the escape \n. '[' is replaced by '<Name>(' and ']' by ')'. Line order
# matters: exam and app syntax filters select lines by index.

